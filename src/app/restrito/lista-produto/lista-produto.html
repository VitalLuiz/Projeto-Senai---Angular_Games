<table class="table">
    <thead>
        <tr>
        <th scope="col">Id</th>
        <th scope="col">Produto</th>
        <th scope="col">Descrição</th>
        <th scope="col">Foto</th>
        <th scope="col">Preço</th>
        <th scope="col">Editar</th>
        <th scope="col">Excluir</th>
        
    </thead>
        <tbody>
            @for (produto of produtos; track $index) {
                <tr>
                    <th scope="row">{{ produto.id }}</th>
                    <td>{{ produto.produto }}</td>
                    <td>{{ produto.descricao }}</td>
                    <td><img mat-card-image src="./assets/{{produto.foto}}" alt="produto"></td>
                    <td>R$ {{ produto.preco }},00</td>
                    <td><a class="btn btn-primary" routerLink="/restrito/editar/{{ produto.id }}"
                    role="button">Editar</a></td>
                    <td><a class="btn btn-danger" role="button" (click)="excluir(produto.id)">Excluir</a></td>
                </tr>
            }
        </tbody>
